<script>
(function(){
const SUPABASE_URL = "https://dzgvawxdnjxemifeactr.supabase.co";
const SUPABASE_KEY = "sb_publishable_to-gABecxZny25QLi0OTcQ_HK8nePyG";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const LOJAS_ORDEM = ["Agua Verde", "Ahu", "Sao Braz"];
const NOME_EXIBICAO = { "Agua Verde": "Água Verde", "Ahu": "Ahú", "Sao Braz": "São Braz" };
const VALOR_HORA = 16.66;

let registros = [];
let lojaAtiva = "";
let carregouUmaVez = false;

let registrosPagamento = [];
let semanaAtivaPay = "atual";

const elConteudo = document.getElementById("conteudo");
const elDataHoje = document.getElementById("dataHoje");
const elAtualizadoEm = document.getElementById("atualizadoEm");
const btnRefresh = document.getElementById("btnRefresh");
const tabs = Array.from(document.querySelectorAll(".tab"));

function diaBrasilia(isoOuMs){
const ms = typeof isoOuMs === "string" ? new Date(isoOuMs).getTime() : isoOuMs;
const d = new Date(ms - 3 * 3600 * 1000);
return d.getUTCFullYear() + "-" + String(d.getUTCMonth()+1).padStart(2,"0") + "-" + String(d.getUTCDate()).padStart(2,"0");
}

function rotuloDia(diaStr, hojeStr, ontemStr){
if (diaStr === hojeStr) return "Hoje";
if (diaStr === ontemStr) return "Ontem";
const [y,m,d] = diaStr.split("-");
return d + "/" + m;
}

function horaBrasilia(iso){
return new Date(iso).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit", timeZone: "America/Sao_Paulo" });
}

function classePill(tipo){
if (tipo === "Chegada") return "chegada";
if (tipo === "Saida" || tipo === "Saída") return "saida";
if (tipo === "Inicio do intervalo") return "inicio";
if (tipo === "Fim do intervalo") return "fim";
return "";
}

function atualizarRelogioTopo(){
const agora = new Date();
elDataHoje.textContent = agora.toLocaleDateString("pt-BR", { weekday: "long", day: "2-digit", month: "long", timeZone: "America/Sao_Paulo" });
}

function renderStats(){
const hojeStr = diaBrasilia(Date.now());
const hojeRegistros = registros.filter(r => diaBrasilia(r.criado_em) === hojeStr);
document.getElementById("statTotalHoje").textContent = hojeRegistros.length;
document.getElementById("statAguaVerde").textContent = hojeRegistros.filter(r => r.loja === "Agua Verde").length;
document.getElementById("statAhu").textContent = hojeRegistros.filter(r => r.loja === "Ahu").length;
document.getElementById("statSaoBraz").textContent = hojeRegistros.filter(r => r.loja === "Sao Braz").length;
}

function renderLista(){
const filtrados = lojaAtiva ? registros.filter(r => r.loja === lojaAtiva) : registros;

if (filtrados.length === 0){
elConteudo.innerHTML = '<div class="empty">Nenhum registro ainda' + (lojaAtiva ? " em " + NOME_EXIBICAO[lojaAtiva] : "") + '.</div>';
return;
}

const hojeStr = diaBrasilia(Date.now());
const ontemStr = diaBrasilia(Date.now() - 24*3600*1000);

const porDia = new Map();
filtrados.forEach(r => {
const dia = diaBrasilia(r.criado_em);
if (!porDia.has(dia)) porDia.set(dia, []);
porDia.get(dia).push(r);
});

const diasOrdenados = Array.from(porDia.keys()).sort().reverse();

let html = "";
diasOrdenados.forEach(dia => {
html += '<div class="day"><span class="day-label">' + rotuloDia(dia, hojeStr, ontemStr) + '</span><div class="ticket-list">';
porDia.get(dia).forEach(r => {
const nomeLoja = NOME_EXIBICAO[r.loja] || r.loja;
const cls = classePill(r.tipo);
html += '<div class="ticket">'
+ '<time>' + horaBrasilia(r.criado_em) + '</time>'
+ '<div class="who"><span class="name">' + escapeHtml(r.nome) + '</span>'
+ '<span class="pill ' + cls + '">' + escapeHtml(r.tipo) + '</span></div>'
+ (lojaAtiva ? "" : '<span class="loja-tag">' + nomeLoja + '</span>')
+ '</div>';
});
html += '</div></div>';
});

elConteudo.innerHTML = html;
}

function escapeHtml(s){
return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function renderErro(msg){
elConteudo.innerHTML = '<div class="error">Não consegui carregar os registros agora.<br>' + escapeHtml(msg || "") + '<br><button id="btnTentarDeNovo" type="button">Tentar de novo</button></div>';
const b = document.getElementById("btnTentarDeNovo");
if (b) b.addEventListener("click", carregar);
}

async function carregar(silencioso){
if (!silencioso || !carregouUmaVez){
elConteudo.innerHTML = '<div class="loading">Carregando os registros…</div>';
}
btnRefresh.classList.add("spinning");
try{
const { data, error } = await sb
.from("registros_ponto")
.select("nome, tipo, loja, criado_em")
.order("criado_em", { ascending: false })
.limit(300);
if (error) throw error;
registros = data || [];
carregouUmaVez = true;
renderStats();
renderLista();
elAtualizadoEm.textContent = "atualizado às " + new Date().toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo" });
} catch(e){
renderErro(e && e.message ? e.message : "Erro desconhecido.");
} finally {
setTimeout(() => btnRefresh.classList.remove("spinning"), 500);
}
}

// --- pagamento semanal (R$16,66/hora), ciclo quarta a terça (igual ao codigo do QR) ---
const CICLO_REF_Y = 2026, CICLO_REF_M = 8, CICLO_REF_D = 9; // Wed 2026-09-09, ciclo 0

function diaEpochBrasilia(ms){
const d = new Date(ms - 3 * 3600 * 1000);
return Math.floor(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()) / 86400000);
}
function diaEpochCalendario(y, m, d){
return Math.floor(Date.UTC(y, m, d) / 86400000);
}
function cicloAtual(){
const refDia = diaEpochCalendario(CICLO_REF_Y, CICLO_REF_M, CICLO_REF_D);
const hojeDia = diaEpochBrasilia(Date.now());
return Math.floor((hojeDia - refDia) / 7);
}
function inicioCicloMs(ciclo){
const refDia = diaEpochCalendario(CICLO_REF_Y, CICLO_REF_M, CICLO_REF_D);
const diaDoCiclo = refDia + ciclo * 7;
return diaDoCiclo * 86400000 + 3 * 3600 * 1000;
}
function formatDiaMes(ms){
const d = new Date(ms - 3 * 3600 * 1000);
return String(d.getUTCDate()).padStart(2,"0") + "/" + String(d.getUTCMonth()+1).padStart(2,"0");
}
function formatHoras(ms){
const totalMin = Math.round(ms / 60000);
const h = Math.floor(totalMin / 60);
const m = totalMin % 60;
return h + "h" + String(m).padStart(2,"0") + "m";
}
function formatBRL(v){
return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}
function normalizarNome(n){
return String(n || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function calcularPagamentos(lista){
const porPessoa = new Map();
const estados = new Map();
const ordenados = lista.slice().sort((a,b) => new Date(a.criado_em) - new Date(b.criado_em));
ordenados.forEach(r => {
const chave = normalizarNome(r.nome) + "|" + r.loja;
if (!porPessoa.has(chave)) porPessoa.set(chave, { nome: (r.nome || "").trim(), loja: r.loja, ms: 0, incompletos: 0 });
if (!estados.has(chave)) estados.set(chave, { status: "fechado" });
const p = porPessoa.get(chave);
const st = estados.get(chave);
const t = new Date(r.criado_em).getTime();
if (r.tipo === "Chegada"){
if (st.status !== "fechado") p.incompletos++;
st.status = "aberto"; st.inicioTurno = t; st.pausaMs = 0;
} else if (r.tipo === "Inicio do intervalo"){
if (st.status === "aberto"){ st.status = "intervalo"; st.inicioIntervalo = t; }
else { p.incompletos++; }
} else if (r.tipo === "Fim do intervalo"){
if (st.status === "intervalo"){ st.pausaMs += (t - st.inicioIntervalo); st.status = "aberto"; }
else { p.incompletos++; }
} else if (r.tipo === "Saida" || r.tipo === "Saída"){
if (st.status === "aberto" || st.status === "intervalo"){
const bruto = t - st.inicioTurno;
const liquido = Math.max(0, bruto - (st.pausaMs || 0));
p.ms += liquido;
st.status = "fechado";
} else {
p.incompletos++;
}
}
});
estados.forEach((st, chave) => {
if (st.status !== "fechado"){
const p = porPessoa.get(chave);
if (p) p.incompletos++;
}
});
return porPessoa;
}

async function carregarPagamento(){
try{
const inicioPassada = inicioCicloMs(cicloAtual() - 1);
const { data, error } = await sb
.from("registros_ponto")
.select("nome, tipo, loja, criado_em")
.gte("criado_em", new Date(inicioPassada).toISOString())
.order("criado_em", { ascending: true })
.limit(5000);
if (error) throw error;
registrosPagamento = data || [];
renderPagamento();
} catch(e){
document.getElementById("payConteudo").innerHTML = '<div class="error" style="padding:16px;">Não consegui calcular agora.<br>' + escapeHtml(e && e.message ? e.message : "") + '</div>';
}
}

function renderPagamento(){
const cicloN = cicloAtual();
const ciclo = semanaAtivaPay === "atual" ? cicloN : cicloN - 1;
const inicio = inicioCicloMs(ciclo);
const fim = inicioCicloMs(ciclo + 1);
document.getElementById("payPeriodo").textContent = formatDiaMes(inicio) + " a " + formatDiaMes(fim - 1);

const doPeriodo = registrosPagamento.filter(r => {
const t = new Date(r.criado_em).getTime();
return t >= inicio && t < fim;
});
const mapa = calcularPagamentos(doPeriodo);
const linhas = Array.from(mapa.values()).sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR"));

let totalMs = 0, totalIncompletos = 0, linhasHtml = "";
if (linhas.length === 0){
linhasHtml = '<p class="pay-nota" style="padding:8px 2px;">Sem registros nessa semana ainda.</p>';
} else {
linhas.forEach(p => {
totalMs += p.ms;
totalIncompletos += p.incompletos;
const valor = (p.ms / 3600000) * VALOR_HORA;
const nomeLoja = NOME_EXIBICAO[p.loja] || p.loja;
linhasHtml += '<div class="pay-row"><div class="pay-who"><span class="pay-name">' + escapeHtml(p.nome) + (p.incompletos ? " *" : "") + '</span><span class="loja-tag">' + nomeLoja + '</span></div><div class="pay-nums"><span class="pay-horas">' + formatHoras(p.ms) + '</span><span class="pay-valor">' + formatBRL(valor) + '</span></div></div>';
});
}
const totalValor = (totalMs / 3600000) * VALOR_HORA;

let html = '<div class="pay-total-linha"><span class="l">Total da semana</span><span class="n">' + formatBRL(totalValor) + '</span></div>';
html += '<div class="pay-list">' + linhasHtml;
html += '<div class="pay-row pay-total"><div class="pay-who"><span class="pay-name">Total</span></div><div class="pay-nums"><span class="pay-horas">' + formatHoras(totalMs) + '</span><span class="pay-valor">' + formatBRL(totalValor) + '</span></div></div>';
html += '</div>';
if (totalIncompletos > 0){
html += '<p class="pay-nota">* tem batida incompleta (faltou marcar entrada ou saída) nessa semana — essas horas não entraram na conta. Dá uma conferida.</p>';
}
document.getElementById("payConteudo").innerHTML = html;
}

document.querySelectorAll(".paytab").forEach(btn => {
btn.addEventListener("click", () => {
semanaAtivaPay = btn.dataset.semana;
document.querySelectorAll(".paytab").forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
renderPagamento();
});
});

tabs.forEach(tab => {
tab.addEventListener("click", () => {
lojaAtiva = tab.dataset.loja;
tabs.forEach(t => t.setAttribute("aria-pressed", t === tab ? "true" : "false"));
renderLista();
});
});

btnRefresh.addEventListener("click", () => carregar(false));

atualizarRelogioTopo();
carregar(false);
carregarPagamento();
setInterval(() => carregar(true), 60000);
setInterval(atualizarRelogioTopo, 60000);
setInterval(carregarPagamento, 60000);
})();
</script>
</body>
