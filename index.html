<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Ponto - Cidadao do Mundo</title><style>body{font-family:Arial,sans-serif;background:#fdf6ec;margin:0;padding:20px;color:#333}.container{max-width:420px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.1)}h1{font-size:22px;text-align:center;color:#b5461f;margin-bottom:4px}.loja{text-align:center;font-size:18px;margin-bottom:20px;font-weight:bold}label{display:block;margin-top:16px;margin-bottom:6px;font-weight:bold}select,input[type=text]{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #ccc;box-sizing:border-box}.tipos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.tipo-btn{padding:16px 8px;font-size:15px;border-radius:10px;border:2px solid #b5461f;background:#fff;color:#b5461f;cursor:pointer}.tipo-btn.sel{background:#b5461f;color:#fff}.reg-btn{width:100%;margin-top:20px;padding:16px;font-size:18px;border-radius:10px;border:none;background:#2e7d32;color:#fff;cursor:pointer}.reg-btn:disabled{background:#aaa}.msg{margin-top:16px;padding:12px;border-radius:8px;text-align:center;font-weight:bold}.msg.ok{background:#e8f5e9;color:#2e7d32}.msg.erro{background:#fdecea;color:#b5461f}.hist{margin-top:24px;font-size:13px;color:#666}.hist div{padding:6px 0;border-bottom:1px solid #eee}</style></head><body><div class="container"><h1>Controle de ponto</h1><div class="loja" id="nomeLoja">-</div><div id="formulario"><label for="nome">Seu nome</label><select id="nome"><option value="">Escolha...</option><option value="Flavia">Flavia</option><option value="Michelle">Michelle</option><option value="Yaimar">Yaimar</option><option value="outro">Outro (digitar)</option></select><input type="text" id="nomeOutro" placeholder="Digite seu nome" style="display:none;margin-top:8px"><label>O que voce esta registrando?</label><div class="tipos"><button class="tipo-btn" data-tipo="Chegada">Chegada</button><button class="tipo-btn" data-tipo="Inicio do intervalo">Inicio do intervalo</button><button class="tipo-btn" data-tipo="Fim do intervalo">Fim do intervalo</button><button class="tipo-btn" data-tipo="Saida">Saida</button></div><button class="reg-btn" id="btnReg" disabled>Registrar</button><div id="mensagem"></div></div><div class="hist" id="hist"></div></div><script>const lojas={aguaverde:"Agua Verde",ahu:"Ahu",saobraz:"Sao Braz"};const params=new URLSearchParams(location.search);const cod=params.get("loja");const nomeLojaEl=document.getElementById("nomeLoja");const form=document.getElementById("formulario");if(!cod||!lojas[cod]){nomeLojaEl.textContent="Link invalido";form.style.display="none";document.getElementById("mensagem").innerHTML="<div class='msg erro'>Link sem loja valida. Peca o QR code certo.</div>";}else{nomeLojaEl.textContent=lojas[cod];}const selNome=document.getElementById("nome");const inOutro=document.getElementById("nomeOutro");selNome.onchange=()=>{inOutro.style.display=selNome.value==="outro"?"block":"none";};let tipoSel=null;const btns=document.querySelectorAll(".tipo-btn");btns.forEach(b=>{b.onclick=()=>{btns.forEach(x=>x.classList.remove("sel"));b.classList.add("sel");tipoSel=b.dataset.tipo;document.getElementById("btnReg").disabled=false;};});function nomeAtual(){if(selNome.value==="outro")return inOutro.value.trim();return selNome.value;}document.getElementById("btnReg").onclick=()=>{const nome=nomeAtual();const msg=document.getElementById("mensagem");if(!nome){msg.innerHTML="<div class='msg erro'>Escolha ou digite seu nome.</div>";return;}if(!tipoSel){msg.innerHTML="<div class='msg erro'>Escolha o que esta registrando.</div>";return;}const agora=new Date();const reg={nome,tipo:tipoSel,loja:lojas[cod],quando:agora.toLocaleString("pt-BR")};const h=JSON.parse(localStorage.getItem("registros")||"[]");h.unshift(reg);localStorage.setItem("registros",JSON.stringify(h));msg.innerHTML="<div class='msg ok'>Registrado: "+nome+" - "+tipoSel+" as "+reg.quando+"</div>";mostrarHist();};function mostrarHist(){const h=JSON.parse(localStorage.getItem("registros")||"[]");const el=document.getElementById("hist");if(h.length===0){el.innerHTML="";return;}el.innerHTML="<strong>Ultimos registros neste aparelho:</strong>"+h.slice(0,5).map(r=>"<div>"+r.quando+" - "+r.nome+" - "+r.tipo+"</div>").join("");}mostrarHist();</script></body></html>
